{{ partial "header.html" . }}
<script>
  // Legacy pages moved from foo.html/ to foo.html (#569); stay on this origin.
  (function () {
    var path = location.pathname.replace(/^\/+/, '/');
    if (/\.html?\/$/.test(path)) {
      location.replace(location.origin + path.slice(0, -1) + location.search + location.hash);
    }
  })();
</script>
<section id="content" role="main">
  <div class="container">
    <div class="row">
      <div class="col-sm-9">
        <h1>404</h1>
        <p>Oh no! We couldn't find that page. Perhaps try using our search feature to find the correct link.</p>
        <br/>
        <div class="centering">
          <img src="/images/site/perl-camel.svg" alt="Perl Dromedary Camel" height="500px" width="452px" />
        </div>
      </div>
      <div class="col-sm-3">
        {{ partial "latest-sidebar.html" . }}
      </div>
    </div>
  </div>
</section>
{{ partial "footer.html" . }}
